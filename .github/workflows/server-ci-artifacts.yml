name: Server CI Artifacts

on:
  workflow_run:
    workflows:
      - Server CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: download-server-package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: server-dist-artifact
          path: server/build

      - name: compute-docker-tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mattermost-team-edition"
          SHORT_SHA="$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          BRANCH_TAG="$(echo "$BRANCH" | tr '[:upper:]/' '[:lower:]-')"

          {
            echo "TAGS<<EOF"
            echo "${IMAGE}:${SHORT_SHA}"
            echo "${IMAGE}:${BRANCH_TAG}"
            if [ "$BRANCH" = "master" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: login-ghcr
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-and-push-image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          provenance: false
          context: server/build
          file: server/build/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            MM_PACKAGE=mattermost-team-linux-amd64.tar.gz
          tags: ${{ steps.meta.outputs.TAGS }}
